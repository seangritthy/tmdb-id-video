<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #141425;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #2a2a3e;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2a3e;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #888;
            font-size: 13px;
        }

        .info-item .label {
            color: #666;
        }

        .info-item .value {
            color: #fff;
            font-weight: 600;
            background: #1e1e32;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 13px;
            min-width: 40px;
            text-align: center;
        }

        .info-item .value.na {
            color: #555;
            opacity: 0.5;
        }

        .divider {
            color: #333;
            font-size: 14px;
        }

        /* ===== SEARCH ===== */
        .search-wrapper {
            flex: 1;
            min-width: 160px;
            position: relative;
        }

        .search-wrapper input {
            width: 100%;
            padding: 8px 16px 8px 36px;
            border-radius: 8px;
            border: 1px solid #2a2a3e;
            background: #0d0d1a;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-wrapper input::placeholder {
            color: #555;
        }

        .search-wrapper input:focus {
            border-color: #dc2626;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: #555;
            pointer-events: none;
        }

        /* ===== POSTER SECTION ===== */
        .poster-section {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            flex-wrap: wrap;
            min-height: 300px;
        }

        .poster-placeholder {
            width: 200px;
            height: 300px;
            flex-shrink: 0;
            border-radius: 12px;
            border: 2px dashed #2a2a3e;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 14px;
            gap: 8px;
        }

        .poster-placeholder svg {
            width: 48px;
            height: 48px;
            color: #2a2a3e;
        }

        .poster-box {
            position: relative;
            width: 200px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            background: #1a1a2e;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: none;
        }

        .poster-box.visible {
            display: block;
        }

        .poster-box:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.2);
        }

        .poster-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .poster-box:hover .play-overlay {
            opacity: 1;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #dc2626;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
        }

        .play-btn:hover {
            background: #ef4444;
            transform: scale(1.1);
        }

        .play-label {
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 14px;
            border-radius: 20px;
        }

        .badge-hd {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #dc2626;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .movie-info {
            flex: 1;
            min-width: 180px;
            padding-top: 4px;
        }

        .movie-info h2 {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            margin: 0 0 4px 0;
        }

        .movie-info .original-title {
            font-size: 14px;
            color: #666;
            margin: 0 0 8px 0;
        }

        .movie-info .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
        }

        .movie-info .meta .rating {
            color: #f5c518;
            font-weight: 600;
        }

        .movie-info .genres {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .movie-info .genres span {
            background: #1e1e32;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: #aaa;
            border: 1px solid #2a2a3e;
        }

        .movie-info .overview {
            font-size: 13px;
            color: #777;
            line-height: 1.6;
        }

        .movie-info .not-found {
            color: #dc2626;
            font-size: 14px;
            padding: 20px 0;
        }

        .loading {
            color: #888;
            font-size: 14px;
            padding: 20px 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }
            .top-bar {
                gap: 8px;
            }
            .info-item {
                font-size: 11px;
            }
            .info-item .value {
                font-size: 11px;
                padding: 2px 8px;
            }
            .poster-section {
                flex-direction: column;
                align-items: center;
            }
            .poster-box,
            .poster-placeholder {
                width: 100%;
                max-width: 280px;
                height: auto;
            }
            .movie-info {
                text-align: center;
            }
            .movie-info .meta {
                justify-content: center;
            }
            .movie-info .genres {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== TOP BAR ===== -->
        <div class="top-bar">

            <!-- TMDB ID (editable) -->
            <div class="info-item">
                <span class="label">TMDB ID</span>
                <input type="number" id="tmdbInput" class="value" value="10195" style="width:70px; background:#1e1e32; border:none; color:#fff; font-weight:600; padding:4px 8px; border-radius:4px; text-align:center;" />
            </div>

            <span class="divider">|</span>

            <!-- Season -->
            <div class="info-item">
                <span class="label">Season</span>
                <span class="value na" id="seasonDisplay">—</span>
            </div>

            <span class="divider">|</span>

            <!-- Episode -->
            <div class="info-item">
                <span class="label">Episode</span>
                <span class="value na" id="episodeDisplay">—</span>
            </div>

            <span class="divider">|</span>

            <!-- Search -->
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                type="text"
                id="searchInput"
                placeholder="Enter TMDB ID..."
                onkeydown="if(event.key === 'Enter') fetchMovie()"
                />
            </div>

        </div>

        <!-- ===== POSTER + INFO ===== -->
        <div class="poster-section" id="posterSection">

            <!-- Placeholder (shown when no movie loaded) -->
            <div class="poster-placeholder" id="placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <path d="M21 15l-5-5L5 21" />
                </svg>
                <span>Enter a TMDB ID</span>
                <span style="font-size:11px; color:#333;">e.g. 10195</span>
            </div>

            <!-- Poster (hidden until movie loads) -->
            <div class="poster-box" id="posterBox">
                <img id="posterImg" src="" alt="Movie Poster" />
                <span class="badge-hd">HD</span>
                <div class="play-overlay" onclick="playVideo()">
                    <button class="play-btn">▶</button>
                    <span class="play-label">Play Video</span>
                </div>
            </div>

            <!-- Movie Info -->
            <div class="movie-info" id="movieInfo">
                <div id="infoContent">
                    <p style="color:#444; font-size:14px; padding-top:20px;">
                        🔍 Search for a movie by TMDB ID
                    </p>
                </div>
            </div>

        </div>

    </div>

    <script>
        // ===== CONFIG =====
        // Replace with your TMDB API Read Access Token
        const TMDB_TOKEN = 'YOUR_TMDB_READ_ACCESS_TOKEN_HERE';

        // ===== DOM REFS =====
        const tmdbInput = document.getElementById('tmdbInput');
        const searchInput = document.getElementById('searchInput');
        const posterBox = document.getElementById('posterBox');
        const posterImg = document.getElementById('posterImg');
        const placeholder = document.getElementById('placeholder');
        const infoContent = document.getElementById('infoContent');
        const seasonDisplay = document.getElementById('seasonDisplay');
        const episodeDisplay = document.getElementById('episodeDisplay');

        // ===== FETCH MOVIE =====
        async function fetchMovie() {
            const tmdbId = tmdbInput.value.trim() || searchInput.value.trim();
            if (!tmdbId) {
                alert('Please enter a TMDB ID');
                return;
            }

            // Show loading
            infoContent.innerHTML = `<p class="loading">⏳ Loading movie...</p>`;
            posterBox.classList.remove('visible');
            placeholder.style.display = 'flex';

            try {
                // Fetch movie details from TMDB
                const response = await fetch(
                    `https://api.themoviedb.org/3/movie/${tmdbId}?language=en-US`,
                    {
                        headers: {
                            'Authorization': `Bearer ${TMDB_TOKEN}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('Movie not found. Check the TMDB ID.');
                    } else {
                        throw new Error(`Error: ${response.status} - ${response.statusText}`);
                    }
                }

                const data = await response.json();

                // ===== UPDATE UI =====
                // Poster
                if (data.poster_path) {
                    posterImg.src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
                    posterImg.alt = data.title;
                    posterBox.classList.add('visible');
                    placeholder.style.display = 'none';
                } else {
                    posterBox.classList.remove('visible');
                    placeholder.style.display = 'flex';
                    placeholder.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <circle cx="8.5" cy="8.5" r="1.5" />
                            <path d="M21 15l-5-5L5 21" />
                        </svg>
                        <span>No poster available</span>
                    `;
                }

                // Movie Info
                const year = data.release_date ? data.release_date.split('-')[0] : 'N/A';
                const runtime = data.runtime ? `${data.runtime} min` : 'N/A';
                const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
                const votes = data.vote_count || 0;

                const genres = data.genres && data.genres.length > 0 ?
                    data.genres.map(g => `<span>${g.name}</span>`).join('') :
                    '<span style="color:#444;">No genres</span>';

                infoContent.innerHTML = `
                    <h2>${data.title}</h2>
                    <p class="original-title">${data.original_title || ''}</p>
                    <div class="meta">
                        <span>${year}</span>
                        <span>${data.production_countries && data.production_countries.length > 0 ? '🇺🇸' : '🌍'} ${data.production_countries && data.production_countries.length > 0 ? data.production_countries[0].iso_3166_1 : 'N/A'}</span>
                        <span>⏱ ${runtime}</span>
                        <span class="rating">★ ${rating}</span>
                        <span style="color:#666;">(${votes} votes)</span>
                    </div>
                    <div class="genres">${genres}</div>
                    <p class="overview">${data.overview || 'No overview available.'}</p>
                `;

                // Season/Episode (always N/A for movies)
                seasonDisplay.textContent = '—';
                episodeDisplay.textContent = '—';

                // Update the input fields with the ID
                tmdbInput.value = tmdbId;
                searchInput.value = tmdbId;

            } catch (error) {
                infoContent.innerHTML = `
                    <p class="not-found">❌ ${error.message}</p>
                    <p style="color:#555; font-size:13px; margin-top:8px;">
                        Try: 10195 (Thor), 299536 (Avengers), 120 (Lord of the Rings)
                    </p>
                `;
                posterBox.classList.remove('visible');
                placeholder.style.display = 'flex';
                placeholder.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </svg>
                    <span>Movie not found</span>
                `;
            }
        }

        // ===== PLAY VIDEO =====
        function playVideo() {
            const tmdbId = tmdbInput.value.trim();
            if (!tmdbId) {
                alert('No movie loaded. Search for a TMDB ID first.');
                return;
            }
            alert(`🎬 Playing movie: TMDB ID ${tmdbId}\n\n(Replace this with your actual video player)`);
            // window.location.href = `/play/${tmdbId}`;
        }

        // ===== AUTO-LOAD ON ENTER =====
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                tmdbInput.value = searchInput.value;
                fetchMovie();
            }
        });

        tmdbInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchInput.value = tmdbInput.value;
                fetchMovie();
            }
        });

        // ===== LOAD DEFAULT MOVIE ON PAGE LOAD =====
        window.addEventListener('DOMContentLoaded', () => {
            // Load Thor (10195) by default
            fetchMovie();
        });
    </script>

</body>
</html>
